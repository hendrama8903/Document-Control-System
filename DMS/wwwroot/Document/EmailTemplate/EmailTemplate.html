<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta name="x-apple-disable-message-reformatting">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta content="telephone=no" name="format-detection">
    <title>{title}</title>
    <!--[if gte mso 9]>
    <xml>
    <o:OfficeDocumentSettings>
    <o:AllowPNG></o:AllowPNG>
    <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->
    <style type="text/css">
        a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
        @media only screen and (max-width:600px) {
            .dcs-container { width: 100% !important; }
            .dcs-pad { padding-left: 16px !important; padding-right: 16px !important; }
            .dcs-col { display: block !important; width: 100% !important; padding-bottom: 12px !important; }
        }
    </style>
</head>
<!--
    Frame email Document Control System.
    Placeholder yang diisi EmailService: {title}, {body}, {buttonLink}, {dateNow}.
    {title} tampil sebagai label kecil di atas body; heading dan kartu informasi dokumen
    disusun di BODY template pada TB_M_SYSTEM (*_EMAIL_TEMPLATE). Tombol selalu dari frame ini.
-->
<body style="margin:0;padding:0;background-color:#F1F3F6;font-family:'Segoe UI', Arial, Helvetica, sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%">
    <table width="100%" cellspacing="0" cellpadding="0" border="0" role="presentation" style="border-collapse:collapse;background-color:#F1F3F6">
        <tr>
            <td align="center" style="padding:24px 8px">
                <table class="dcs-container" width="600" cellspacing="0" cellpadding="0" border="0" role="presentation" style="border-collapse:separate;width:600px;background-color:#FFFFFF;border:1px solid #E3E7ED;border-radius:12px">
                    <!-- header -->
                    <tr>
                        <td class="dcs-pad" style="padding:20px 24px 16px 24px;border-bottom:1px solid #E3E7ED">
                            <table cellspacing="0" cellpadding="0" border="0" role="presentation" style="border-collapse:collapse">
                                <tr>
                                    <td valign="top" style="padding:2px 10px 0 0">
                                        <table cellspacing="0" cellpadding="0" border="0" role="presentation" style="border-collapse:separate">
                                            <tr>
                                                <td align="center" valign="middle" width="20" height="22" style="width:20px;height:22px;border:2px solid #334E68;border-radius:4px;font-size:12px;line-height:12px;font-weight:bold;color:#334E68">&#10003;</td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td valign="top">
                                        <div style="font-size:16px;line-height:20px;font-weight:600;color:#1F2A37">Document Control System</div>
                                        <div style="font-size:12px;line-height:16px;color:#6B7280">Internal Notification</div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- label -->
                    <tr>
                        <td class="dcs-pad" style="padding:20px 24px 0 24px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;color:#4B5563">{title}</td>
                    </tr>
                    <!-- body -->
                    <tr>
                        <td class="dcs-pad" style="padding:8px 24px 16px 24px;font-size:14px;line-height:21px;color:#1F2A37">{body}</td>
                    </tr>
                    <!-- button -->
                    <tr>
                        <td class="dcs-pad" style="padding:0 24px 16px 24px">
                            <table width="100%" cellspacing="0" cellpadding="0" border="0" role="presentation" style="border-collapse:separate">
                                <tr>
                                    <td align="center" bgcolor="#334E68" style="background-color:#334E68;border-radius:6px">
                                        <a href="{buttonLink}" target="_blank" style="display:block;padding:12px 20px;font-size:15px;line-height:20px;font-weight:600;color:#FFFFFF;text-decoration:none;border-radius:6px">Review Document</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- footer -->
                    <tr>
                        <td align="center" style="padding:0 24px 20px 24px;font-size:12px;line-height:16px;color:#6B7280">Document Control System &middot; Internal Use Only</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
